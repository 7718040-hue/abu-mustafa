<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص الهاتف</title><style>body{background:#eee8ec;color:#432736;margin:0;font:16px Arial}header{padding:16px;position:sticky;top:0;background:#fff;display:flex;align-items:center;gap:12px;z-index:2;justify-content:center}button{padding:9px 16px;font:inherit;border:1px solid #ad8292;border-radius:5px;background:#fff}output{display:block;min-width:310px;font-size:13px;max-width:400px}iframe{display:block;width:390px;height:780px;margin:20px auto;border:1px solid #c5aebb;background:white;border-radius:14px}#stage{overflow:auto}</style></head><body><header><button data-width="360">هاتف 360</button><button data-width="390">هاتف 390</button><button data-width="768">لوحي 768</button><button data-page="/">المتجر</button><button data-page="/admin/">الإدارة</button><button data-page="/#contact-directory">دليل التواصل</button><output id="metrics">جارٍ قياس العرض</output></header><div id="stage"><iframe title="معاينة الهاتف" id="phone" src="/?__qa=1"></iframe></div><script>const frame=document.getElementById('phone');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{const url=new URL(b.dataset.page,location.origin);url.searchParams.set('__qa','1');frame.src=url.href;});window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin||e.data?.kind!=='qa-metrics')return;document.getElementById('metrics').textContent=JSON.stringify(e.data);});</script></body></html>
