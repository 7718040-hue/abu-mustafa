name: Verify deployed sites (read only)
on:
  push:
    branches: [verify/production-2026-10-17]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify every preview product, image, indexing and administration boundary
        run: node tests/preview-live.mjs
      - name: Verify every production product, image, indexing and administration boundary
        run: node tests/preview-live.mjs --production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-site-verification
          path: |
            docs/preview-live-results.json
            docs/production-live-results.json
