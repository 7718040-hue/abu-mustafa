name: Validate website and preview
on:
  push:
    branches: [cost-optimization, cloudflare-hosting]
  pull_request:
    branches: [cloudflare-hosting]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify deployed isolated preview (read only)
        run: node tests/preview-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cost-verification
          path: |
            docs/cost-measurements.json
            docs/preview-live-results.json
